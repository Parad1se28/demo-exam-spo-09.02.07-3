<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewpoert" content="width=device-width, initial-scale=1.0">
        <title>Регистрация - Корочки.есть</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div class="app-container">
            <div class="form-container">
                <h2>Регистрация</h2>

                <form id="registerForm">
                    <div class="input-group">
                        <label for="regLogin">Логин (лат. и цифры, мин. 6 симв.)</label>
                        <input type="text" id="regLogin" required>
                        <span class="error-text" id="errLogin">Некорректный логин</span>
                    </div>
                
                    <div class="input-group">
                        <label for="regPassword">Пароль (мин. 8 симв.)</label>
                        <input type="password" id="regPassword" required>
                        <span class="error-text" id="errPassword">Пароль слишком короткий</span>
                    </div>
                
                    <div class="input-group">
                        <label for="regFio">ФИО</label>
                        <input type="text" id="regFio" required>
                        <span class="error-text" id="errFio">Только кириллица и пробелы</span>
                    </div>
                
                    <div class="input-group">
                        <label for="regPhone">Телефон</label>
                        <input type="tel" id="regPhone" placeholder="8(XXX)XXX-XX-XX" required>
                        <span class="error-text" id="errPhone">Формат: 8(XXX)XXX-XX-XX</span>
                    </div>
                
                    <div class="input-group">
                        <label for="regEmail">Email</label>
                        <input type="email" id="regEmail" required>
                        <span class="error-text" id="errEmail">Некорректный email</span>
                    </div>
                
                    <div class="error-text" id="serverError" style="text-align: center; font-size: 14px; margin-bottom: 10px;"></div>
                
                    <button type="submit" class="btn-primary">Создать пользователя</button>
                </form>

                <a href="login.html" class="link-text">Еще не зарегистрированы? Авторизация</a>
            </div>
        </div>
        <script src="js/app.js"></script>
    </body>
</html>
